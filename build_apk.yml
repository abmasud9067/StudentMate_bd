name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Set aside custom source (lib/ + pubspec.yaml)
        run: |
          mkdir -p /tmp/mysrc
          cp -r lib /tmp/mysrc/lib
          cp pubspec.yaml /tmp/mysrc/pubspec.yaml
          rm -rf lib pubspec.yaml

      - name: Scaffold native Android project
        run: flutter create --platforms=android --org com.studentmatebd .

      - name: Restore custom source
        run: |
          rm -rf lib
          cp -r /tmp/mysrc/lib lib
          cp /tmp/mysrc/pubspec.yaml pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: studentmate-bd-apk
          path: build/app/outputs/flutter-apk/app-release.apk
